<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Formulario 1 -->
    <div style="width: 500px; margin: auto; background-color: #cccccc; border-radius: 15px;">
        <form style="padding: 20px;">
            <table>
                <tr>
                    <td><label>Nombre</label></td>
                    <td><input type="text" name="nombre" placeholder="Escribe tu nombre"></td>
                </tr>
                <tr>
                    <td><label>Apellidos</label></td>
                    <td><input type="text" name="apellido" placeholder="1r Apellido"></td>
                </tr>
                <tr>
                    <td><label>Email</label></td>
                    <td><input type="email" name="email" placeholder="email"></td>
                </tr>
                <tr>
                    <td><label>Asunto</label></td>
                    <td><input type="text" name="asunto" placeholder="titular de la consulta"></td>
                </tr>
            </table>
            <br>
            <label>Mensaje</label>
            <br>
            <textarea name="mensaje" rows="5" cols="60" placeholder="describe brevemente en menos de 300 carácteres" maxlength="300"></textarea>
            <br><br>
            <button style="border-radius: 7px; width: 460px; padding: 5px; background-color: black; color: white;">enviar datos</button>
        </form>
    </div>

    <br><br>



    <!-- Formulario 2 -->
    <div style="width: 500px; margin: auto; text-align: center; border: 1px solid black; border-radius: 15px; box-shadow: 8px 8px 1px rgba(0, 0, 0, 0.15);">
        <h2>Formulario de registro</h2>
        <form style="margin-bottom: 20px; margin-left: 20px;">
            <table>
                <tr>
                    <td><label>Nombre</label></td>
                    <td><input type="text" name="nombre" placeholder="Nombre"></td>
                </tr>
                <tr>
                    <td><label>Fecha de registro</label></td>
                    <td><input type="date" name="fecha"></td>
                </tr>
                <tr>
                    <td><label>Email</label></td>
                    <td><input type="email" name="email" placeholder="Email"></td>
                </tr>
                <tr>
                    <td><label>Password</label></td>
                    <td><input type="password" name="password" placeholder="Password"></td>
                </tr>
            </table>
            <button style="width: 100px; background-color: rgb(133, 124, 124); color: white; padding: 5px;">Enviar</button>
        </form>
    </div>

    <br><br>



    <!-- Formulario 3 -->
     <div style="width: 500px; margin: auto;">
        <h2 style="background-color: #9cffac; text-align: center; padding: 20px 0px;">Registro trabajadores</h2>
        <form>
            <table>
                <tr>
                    <td><label>Rut:</label></td>
                    <td><input type="text" placeholder="Sin puntos ni guión"></td>
                </tr>
                <tr>
                    <td><label>Nombre:</label></td>
                    <td><input type="text" name="nombre"></td>
                </tr>
                <tr>
                    <td><label>Apellido paterno:</label></td>
                    <td><input type="text" name="apellidoPaterno"></td>
                </tr>
                <tr>
                    <td><label>Apellido materno:</label></td>
                    <td><input type="text" name="apellidoMaterno"></td>
                </tr>
                <tr>
                    <td><label>Sexo:</label></td>
                    <td><input type="radio" name="genero" value="masculino">
                        <label for="masculino">Masculino</label>
                        <input type="radio" name="genero" value="femenino">
                        <label for="femenino">Femenino</label>
                    </td>
                </tr>
                <tr>
                    <td><label>Nivel de estudio:</label></td>
                    <td>
                        <input type="checkbox" name="estudio" value="noTiene">
                        <label for="noTiene">No tiene</label><br>
                        <input type="checkbox" name="estudio" value="tecnico">
                        <label for="noTiene">Técnico</label><br>
                        <input type="checkbox" name="estudio" value="universitario">
                        <label for="noTiene">Universitario</label>
                    </td>
                </tr>
                <tr>
                    <td><label>Ciudad de nacimiento:</label></td>
                    <td>
                        <select name="lugarNacimiento">
                            <option value="rancagua">Rancagua</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label>Curriculum</label></td>
                    <td><input type="file" name="curriculum"></td>
                </tr>
                <tr>
                    <td><label>Foto</label></td>
                    <td><input type="file" name="foto"></td>
                </tr>
                <tr style="background-color: #9cffac; text-align: center;">
                    <td colspan="2" style=" padding: 10px;"><button>Registrar trabajador</button><br></td>
                </tr>
            </table>
        </form>
     </div>
</body>
</html>
